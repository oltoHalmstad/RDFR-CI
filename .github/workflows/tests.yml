name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Unit tests
        run: pytest -q
      - name: Deterministic reproduction smoke test
        run: python experiments/run_all.py --smoke
      - name: Restricted-data guardrail
        run: |
          test -z "$(find data/private -type f ! -name .gitkeep -print)"
          test -z "$(git ls-files 'data/private/*' | grep -v 'data/private/.gitkeep' || true)"
