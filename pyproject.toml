[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdfr-ci"
version = "1.0.0"
description = "Reference implementation and reproducibility harness for RDFR-CI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Olga Torstensson"},
  {name = "Dmytro Prokopovych-Tkachenko"}
]
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "pydantic>=2.7"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
